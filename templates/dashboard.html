<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahil's system monitor</title>
<style>
  :root {
    --bg: #e9ece6; --panel: #f8f9f6; --ink: #1e2a2f; --muted: #5e6b6f;
    --line: #cfd5cd; --track: #dde2db;
    --ok: #0f6e7c; --warn: #b7791f; --bad: #b3382c;
    --accent: #0f6e7c; --accent-ink: #f8f9f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161d20; --panel: #1f282c; --ink: #e6ebe8; --muted: #93a2a6;
      --line: #324046; --track: #2b373c;
      --ok: #4fb3c2; --warn: #e0a84a; --bad: #e0705f;
      --accent: #4fb3c2; --accent-ink: #11181b;
    }
  }
  :root[data-theme="light"] {
    --bg: #e9ece6; --panel: #f8f9f6; --ink: #1e2a2f; --muted: #5e6b6f;
    --line: #cfd5cd; --track: #dde2db;
    --ok: #0f6e7c; --warn: #b7791f; --bad: #b3382c;
    --accent: #0f6e7c; --accent-ink: #f8f9f6;
  }
  :root[data-theme="dark"] {
    --bg: #161d20; --panel: #1f282c; --ink: #e6ebe8; --muted: #93a2a6;
    --line: #324046; --track: #2b373c;
    --ok: #4fb3c2; --warn: #e0a84a; --bad: #e0705f;
    --accent: #4fb3c2; --accent-ink: #11181b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45;
  }
  main { max-width: 980px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 1.4rem; margin: 0; font-weight: 650; }
  .meta { color: var(--muted); font-size: .9rem; }
  .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .status.off { background: var(--bad); }
  .status.paused { background: var(--warn); }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-top: 16px; padding: 10px 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; font-size: .85rem; color: var(--muted);
  }
  .toolbar .spacer { flex: 1; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 7px; padding: 6px 12px; font-size: .85rem; font-family: inherit; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  select, input[type="text"] {
    appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 7px; padding: 6px 10px; font-size: .85rem; font-family: inherit;
  }
  label.field { display: flex; align-items: center; gap: 6px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .panel.wide { grid-column: 1 / -1; }
  h2 { font-size: .95rem; margin: 0 0 10px; font-weight: 600; color: var(--muted); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .big small { font-size: 1.2rem; font-weight: 500; color: var(--muted); }
  .sub { color: var(--muted); font-size: .88rem; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .5s ease, background .3s; }
  .bar > i.warn { background: var(--warn); }
  .bar > i.bad { background: var(--bad); }
  .cores { display: flex; gap: 6px; align-items: flex-end; height: 90px; margin-top: 16px; }
  .core { flex: 1; min-width: 8px; max-width: 48px; height: 100%; display: flex; flex-direction: column;
          justify-content: flex-end; align-items: center; gap: 4px; font-size: .7rem; color: var(--muted); }
  .core .col { width: 100%; flex: 1; background: var(--track); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
  .core .col i { display: block; width: 100%; height: 0; background: var(--ok); transition: height .5s ease; }
  .core .col i.warn { background: var(--warn); }
  .core .col i.bad { background: var(--bad); }
  .row { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; padding: 3px 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .panel-head h2 { margin: 0; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; user-select: none; cursor: pointer; white-space: nowrap; }
  th.sorted { color: var(--ink); }
  th .arrow { font-size: .7em; opacity: .7; }
  td.num, th.num { text-align: right; }
  tr.flash { animation: flash 1s ease; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 18%, transparent); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>System Monitor</h1>
    <div class="meta"><span id="status" class="status"></span><span id="host">connecting…</span> · up <span id="uptime">–</span></div>
  </header>

  <div class="toolbar">
    <button class="btn" id="pause-btn" type="button" aria-pressed="false">Pause</button>
    <label class="field">Refresh
      <select id="interval">
        <option value="1000">1s</option>
        <option value="2000" selected>2s</option>
        <option value="5000">5s</option>
        <option value="10000">10s</option>
      </select>
    </label>
    <span id="last-updated">–</span>
    <div class="spacer"></div>
    <label class="field">
      <input type="text" id="proc-filter" placeholder="Filter processes…">
    </label>
    <button class="btn" id="theme-btn" type="button">Theme: Auto</button>
  </div>

  <div class="grid">
    <section class="panel wide">
      <h2>CPU</h2>
      <div class="big"><span id="cpu">–</span><small>%</small></div>
      <div class="sub">Load average (1 / 5 / 15 min): <span id="load">–</span></div>
      <div class="cores" id="cores" aria-label="Usage per CPU core"></div>
    </section>

    <section class="panel">
      <h2>Memory</h2>
      <div class="big"><span id="mem">–</span><small>%</small></div>
      <div class="bar"><i id="mem-bar"></i></div>
      <div class="sub" id="mem-detail">–</div>
    </section>

    <section class="panel">
      <h2>Disk (/)</h2>
      <div class="big"><span id="disk">–</span><small>%</small></div>
      <div class="bar"><i id="disk-bar"></i></div>
      <div class="sub" id="disk-detail">–</div>
    </section>

    <section class="panel">
      <h2>Network</h2>
      <div class="row"><span>Download</span><strong id="down">–</strong></div>
      <div class="row"><span>Upload</span><strong id="up">–</strong></div>
      <div class="sub">Total received <span id="recv">–</span>, sent <span id="sent">–</span></div>
    </section>

    <section class="panel wide">
      <div class="panel-head">
        <h2>Busiest processes</h2>
        <span class="sub" id="proc-count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-key="name">Name <span class="arrow"></span></th>
              <th class="num" data-key="pid">PID <span class="arrow"></span></th>
              <th class="num" data-key="cpu">CPU % <span class="arrow"></span></th>
              <th class="num" data-key="memory">Memory % <span class="arrow"></span></th>
            </tr>
          </thead>
          <tbody id="procs"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let last = null;
  let timer = null;
  let paused = false;
  let intervalMs = 2000;
  let sortKey = "cpu";
  let sortDir = -1; // -1 desc, 1 asc
  let filterText = "";
  let latestProcs = [];
  const prevRows = new Map();

  const level = (v) => (v >= 90 ? "bad" : v >= 70 ? "warn" : "");
  const setBar = (el, v) => { el.style.width = v + "%"; el.className = level(v); };

  function bytes(n) {
    const units = ["B", "KB", "MB", "GB", "TB"];
    let i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return n.toFixed(i === 0 ? 0 : 1) + " " + units[i];
  }

  function duration(s) {
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    return (d ? d + "d " : "") + h + "h " + m + "m";
  }

  function drawCores(values) {
    const box = $("cores");
    if (box.children.length !== values.length) {
      box.replaceChildren(...values.map((_, i) => {
        const core = document.createElement("div");
        core.className = "core";
        core.innerHTML = '<div class="col"><i></i></div><span>' + (i + 1) + "</span>";
        return core;
      }));
    }
    values.forEach((v, i) => {
      const bar = box.children[i].querySelector("i");
      bar.style.height = v + "%";
      bar.className = level(v);
      box.children[i].title = "Core " + (i + 1) + ": " + v + "%";
    });
  }

  function updateSortIndicators() {
    document.querySelectorAll("th[data-key]").forEach((th) => {
      const arrow = th.querySelector(".arrow");
      const isSorted = th.dataset.key === sortKey;
      th.classList.toggle("sorted", isSorted);
      arrow.textContent = isSorted ? (sortDir === 1 ? "▲" : "▼") : "";
    });
  }

  function applyProcView() {
    let list = latestProcs;
    if (filterText) {
      const needle = filterText.toLowerCase();
      list = list.filter((p) => p.name.toLowerCase().includes(needle) || String(p.pid).includes(needle));
    }
    list = list.slice().sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string") return av.localeCompare(bv) * sortDir;
      return (av - bv) * sortDir;
    });
    $("proc-count").textContent = list.length + (filterText ? " matching" : " shown");
    $("procs").replaceChildren(...list.map((p) => {
      const tr = document.createElement("tr");
      const prev = prevRows.get(p.pid);
      if (prev !== undefined && prev !== p.cpu) tr.classList.add("flash");
      prevRows.set(p.pid, p.cpu);
      [p.name, p.pid, p.cpu, p.memory].forEach((val, i) => {
        const td = document.createElement("td");
        if (i > 0) td.className = "num";
        td.textContent = val;
        tr.appendChild(td);
      });
      return tr;
    }));
    updateSortIndicators();
  }

  function render(d) {
    $("host").textContent = d.hostname;
    $("uptime").textContent = duration(d.uptime_seconds);
    $("cpu").textContent = d.cpu_percent.toFixed(1);
    $("load").textContent = d.load_avg.join(" / ");
    drawCores(d.per_cpu);

    $("mem").textContent = d.memory_percent.toFixed(1);
    setBar($("mem-bar"), d.memory_percent);
    $("mem-detail").textContent = bytes(d.memory_used) + " of " + bytes(d.memory_total) + " used";

    $("disk").textContent = d.disk_percent.toFixed(1);
    setBar($("disk-bar"), d.disk_percent);
    $("disk-detail").textContent = bytes(d.disk_used) + " of " + bytes(d.disk_total) + " used";

    $("recv").textContent = bytes(d.net_recv);
    $("sent").textContent = bytes(d.net_sent);
    const now = Date.now();
    if (last) {
      const secs = (now - last.t) / 1000;
      $("down").textContent = bytes((d.net_recv - last.recv) / secs) + "/s";
      $("up").textContent = bytes((d.net_sent - last.sent) / secs) + "/s";
    }
    last = { t: now, recv: d.net_recv, sent: d.net_sent };

    latestProcs = d.processes;
    applyProcView();
    $("last-updated").textContent = "updated " + new Date(now).toLocaleTimeString();
  }

  async function tick() {
    if (paused) return;
    try {
      const res = await fetch("/stats");
      if (!res.ok) throw new Error(res.status);
      render(await res.json());
      $("status").className = "status";
    } catch (e) {
      $("status").className = "status off";
      $("host").textContent = "Connection lost, retrying…";
    }
  }

  function scheduleTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(tick, intervalMs);
  }

  // Pause / resume
  $("pause-btn").addEventListener("click", () => {
    paused = !paused;
    $("pause-btn").textContent = paused ? "Resume" : "Pause";
    $("pause-btn").classList.toggle("active", paused);
    $("pause-btn").setAttribute("aria-pressed", String(paused));
    $("status").className = "status" + (paused ? " paused" : "");
    if (!paused) tick();
  });

  // Refresh interval
  $("interval").addEventListener("change", (e) => {
    intervalMs = Number(e.target.value);
    scheduleTimer();
  });

  // Process filter
  $("proc-filter").addEventListener("input", (e) => {
    filterText = e.target.value.trim();
    applyProcView();
  });

  // Sortable columns
  document.querySelectorAll("th[data-key]").forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key) {
        sortDir *= -1;
      } else {
        sortKey = key;
        sortDir = -1;
      }
      applyProcView();
    });
  });

  // Theme toggle: auto -> light -> dark -> auto
  const THEME_KEY = "sysmon-theme";
  function applyTheme(mode) {
    const root = document.documentElement;
    if (mode === "auto") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", mode);
    $("theme-btn").textContent = "Theme: " + mode[0].toUpperCase() + mode.slice(1);
  }
  function loadTheme() {
    try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; }
  }
  function saveTheme(mode) {
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* ignore */ }
  }
  let theme = loadTheme();
  applyTheme(theme);
  $("theme-btn").addEventListener("click", () => {
    theme = theme === "auto" ? "light" : theme === "light" ? "dark" : "auto";
    saveTheme(theme);
    applyTheme(theme);
  });

  tick();
  scheduleTimer();
</script>
</body>
</html>
